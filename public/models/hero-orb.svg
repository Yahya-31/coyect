<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071226"/>
      <stop offset="50%" stop-color="#040913"/>
      <stop offset="100%" stop-color="#02050B"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#040913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSpec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurSm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Dark navy void -->
  <rect width="1200" height="675" fill="url(#navyBg)"/>

  <!-- Volumetric glow in center -->
  <circle cx="600" cy="337" r="280" fill="url(#orbGlow)" filter="url(#blurLg)"/>

  <!-- Orbital Rings -->
  <ellipse cx="600" cy="337" rx="360" ry="110" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-12 600 337)"/>
  <ellipse cx="600" cy="337" rx="420" ry="140" fill="none" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="10 8" transform="rotate(24 600 337)"/>

  <!-- Orbiting 3D Objects -->
  <!-- 1. Speech bubble orb (top left) -->
  <g transform="translate(320, 240)">
    <circle cx="0" cy="0" r="28" fill="#0B1426" stroke="#22D3EE" stroke-width="2" opacity="0.9"/>
    <circle cx="-6" cy="-6" r="10" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="0" cy="0" r="14" fill="#22D3EE" opacity="0.4" filter="url(#blurSm)"/>
  </g>

  <!-- 2. Light Funnel (top right) -->
  <g transform="translate(860, 220)">
    <ellipse cx="0" cy="-12" rx="26" ry="8" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="6" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <polygon points="-14,4 14,4 0,28" fill="#EC4899" opacity="0.7" filter="url(#blurSm)"/>
  </g>

  <!-- 3. Interlocking Gears (far right) -->
  <g transform="translate(980, 360)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="10" fill="#8B5CF6" opacity="0.4"/>
  </g>

  <!-- 4. Floating Chart (bottom right) -->
  <g transform="translate(780, 450)">
    <rect x="-20" y="-10" width="8" height="24" rx="2" fill="#22D3EE" opacity="0.8"/>
    <rect x="-8" y="-22" width="8" height="36" rx="2" fill="#8B5CF6" opacity="0.85"/>
    <rect x="4" y="-30" width="8" height="44" rx="2" fill="#EC4899" opacity="0.9"/>
  </g>

  <!-- 5. Prism (bottom left) -->
  <g transform="translate(400, 440)">
    <polygon points="0,-26 24,18 -24,18" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <polygon points="0,-18 16,14 -16,14" fill="#22D3EE" opacity="0.3" filter="url(#blurSm)"/>
  </g>

  <!-- 6. Eye Lens (far left) -->
  <g transform="translate(220, 340)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="7" fill="#22D3EE" opacity="0.8" filter="url(#blurSm)"/>
  </g>

  <!-- Central Glowing Glass Crystal Orb -->
  <circle cx="600" cy="337" r="110" fill="url(#glassSpec)"/>
  <circle cx="600" cy="337" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="600" cy="337" r="108" fill="none" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/>
  <circle cx="560" cy="295" r="45" fill="#FFFFFF" opacity="0.25" filter="url(#blurSm)"/>
  <circle cx="600" cy="337" r="60" fill="#8B5CF6" opacity="0.4" filter="url(#blurSm)"/>
  <circle cx="600" cy="337" r="25" fill="#22D3EE" opacity="0.85"/>

  <!-- Vignette -->
  <rect width="1200" height="675" fill="none" stroke="#040913" stroke-width="60" opacity="0.9"/>
</svg>
