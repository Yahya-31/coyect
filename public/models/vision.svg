<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#cardBg)"/>
  <circle cx="300" cy="300" r="160" fill="url(#eyeGlow)" filter="url(#eyeBlur)"/>

  <!-- Glowing Eye-Lens / Aperture Object -->
  <g transform="translate(300, 300)">
    <!-- Outer Glass Ring Bezel -->
    <circle cx="0" cy="0" r="125" fill="#FFFFFF" fill-opacity="0.03" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.8"/>
    
    <!-- Concentric Aperture Rings -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="85" fill="#0B1426" fill-opacity="0.8" stroke="#22D3EE" stroke-width="2"/>

    <!-- Aperture Blades (Geometric Iris) -->
    <path d="M-60,-30 L0,-65 L60,-30 L45,45 L-45,45 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Glowing Iris Lens (Convex Glass Core) -->
    <circle cx="0" cy="0" r="50" fill="#8B5CF6" fill-opacity="0.4" stroke="#22D3EE" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="28" fill="#22D3EE" fill-opacity="0.9" filter="url(#eyeBlur)"/>
    <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>

    <!-- Specular Arc Reflection -->
    <path d="M-70,-65 A95,95 0 0,1 40,-85" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Magenta Rim Light on Edge -->
    <path d="M60,65 A125,125 0 0,0 120,-15" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
