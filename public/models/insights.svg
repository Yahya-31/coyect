<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="chartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="chartBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#cardBg)"/>
  <circle cx="300" cy="300" r="160" fill="url(#chartGlow)" filter="url(#chartBlur)"/>

  <!-- Floating 3D Bar & Line Chart in Glass Space -->
  <g transform="translate(300, 310)">
    <!-- Base grid plane (isometric tilt) -->
    <ellipse cx="0" cy="80" rx="150" ry="40" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

    <!-- 3D Glass Bars -->
    <!-- Bar 1 -->
    <g transform="translate(-85, 0)">
      <rect x="-16" y="10" width="32" height="60" rx="6" fill="#22D3EE" fill-opacity="0.3" stroke="#22D3EE" stroke-width="2"/>
      <polygon points="-16,10 0,0 32,0 16,10" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- Bar 2 -->
    <g transform="translate(-30, -35)">
      <rect x="-16" y="10" width="32" height="95" rx="6" fill="#8B5CF6" fill-opacity="0.35" stroke="#8B5CF6" stroke-width="2"/>
      <polygon points="-16,10 0,0 32,0 16,10" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>

    <!-- Bar 3 -->
    <g transform="translate(25, -70)">
      <rect x="-16" y="10" width="32" height="130" rx="6" fill="#22D3EE" fill-opacity="0.4" stroke="#22D3EE" stroke-width="2"/>
      <polygon points="-16,10 0,0 32,0 16,10" fill="#FFFFFF" fill-opacity="0.35"/>
    </g>

    <!-- Bar 4 (Peak) -->
    <g transform="translate(80, -110)">
      <rect x="-16" y="10" width="32" height="170" rx="6" fill="#EC4899" fill-opacity="0.45" stroke="#EC4899" stroke-width="2.5"/>
      <polygon points="-16,10 0,0 32,0 16,10" fill="#FFFFFF" fill-opacity="0.4"/>
      <!-- Magenta rim light -->
      <line x1="16" y1="10" x2="16" y2="180" stroke="#EC4899" stroke-width="3"/>
    </g>

    <!-- Floating 3D Trend Line -->
    <path d="M-85,25 Q-30,-20 25,-55 T80,-95" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="-95" r="7" fill="#22D3EE" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
