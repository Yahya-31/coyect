<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="gearGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="gearBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#cardBg)"/>
  <circle cx="300" cy="300" r="160" fill="url(#gearGlow)" filter="url(#gearBlur)"/>

  <!-- Interlocking Glass Gears -->
  <g transform="translate(300, 300)">
    <!-- Primary Gear (Top Left) -->
    <g transform="translate(-45, -40)">
      <circle cx="0" cy="0" r="75" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#22D3EE" stroke-width="6" stroke-dasharray="14 10"/>
      <circle cx="0" cy="0" r="35" fill="#8B5CF6" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="15" fill="#22D3EE" fill-opacity="0.9"/>
      <!-- Glass reflection highlight -->
      <ellipse cx="-20" cy="-25" rx="30" ry="12" fill="#FFFFFF" fill-opacity="0.2" transform="rotate(-30 -20 -25)"/>
    </g>

    <!-- Secondary Gear (Bottom Right, Interlocking) -->
    <g transform="translate(55, 45)">
      <circle cx="0" cy="0" r="62" fill="#FFFFFF" fill-opacity="0.04" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-dasharray="12 9"/>
      <circle cx="0" cy="0" r="28" fill="#EC4899" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="12" fill="#EC4899" fill-opacity="0.85"/>
      <!-- Magenta rim light -->
      <path d="M30,30 A62,62 0 0,0 60,-5" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
