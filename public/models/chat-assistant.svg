<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#cardBg)"/>
  <circle cx="300" cy="300" r="160" fill="url(#innerGlow)" filter="url(#glowFilt)"/>

  <!-- Speech bubble 3D orb -->
  <g transform="translate(300, 290)">
    <!-- Translucent outer glass sphere -->
    <circle cx="0" cy="0" r="120" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.75"/>
    <path d="M-40,80 Q-70,140 -90,130 Q-60,110 -20,95 Z" fill="#22D3EE" fill-opacity="0.3" stroke="#22D3EE" stroke-width="2"/>
    
    <!-- Specular highlight -->
    <ellipse cx="-45" cy="-45" rx="55" ry="32" fill="#FFFFFF" fill-opacity="0.25" transform="rotate(-30 -45 -45)"/>
    
    <!-- Inner glowing message core -->
    <rect x="-42" y="-32" width="84" height="60" rx="16" fill="#8B5CF6" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Chat dots -->
    <circle cx="-20" cy="-2" r="6" fill="#22D3EE"/>
    <circle cx="0" cy="-2" r="6" fill="#FFFFFF"/>
    <circle cx="20" cy="-2" r="6" fill="#EC4899"/>
    
    <!-- Magenta rim light -->
    <path d="M60,-80 A120,120 0 0,1 110,30" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
