<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="coyectBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="70%" stop-color="#040913" />
      <stop offset="100%" stop-color="#02050b" />
    </radialGradient>

    <!-- Cyan to Royal Blue dynamic arrow gradient -->
    <linearGradient id="coyectCyanBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#00C4FF" />
      <stop offset="70%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <!-- Glow filters for circular neon ring -->
    <filter id="coyectGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="238" fill="url(#coyectBg)" />

  <!-- Outer Neon Halo Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#00B4D8" stroke-width="2.5" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.9" />

  <!-- Central Symbol Group -->
  <g id="coyect-symbol" transform="translate(250, 185) scale(1.15)">
    <!-- Back support leg of the Y/arch (rich electric blue with rounded base) -->
    <path
      d="M -15,-60 L 22,-60 L 22,50 C 22,54 18,58 14,58 L -11,58 C -15,58 -15,54 -15,50 Z"
      fill="#0091FF"
      opacity="0.95"
    />

    <!-- Main dynamic loop (c/o) seamlessly swooping up into the 45-deg market growth arrow -->
    <!-- Outer loop and arrow -->
    <path
      d="M -40,-58 
         C -78,-58 -104,-30 -104,10 
         C -104,50 -74,78 -35,78 
         C 14,78 48,46 76,0 
         L 52,-18 
         C 28,18 4,44 -32,44 
         C -56,44 -74,28 -74,10 
         C -74,-12 -58,-28 -38,-28 
         C -18,-28 -6,-16 2,0 
         L 32,-10 
         C 18,-38 -6,-58 -40,-58 Z"
      fill="url(#coyectCyanBlue)"
    />

    <!-- Diagonal Arrow Shaft leading directly to top right -->
    <path
      d="M -45,62 
         C -15,64 16,52 46,14 
         L 70,-18 
         L 50,-34 
         L 32,-10 
         C 8,24 -15,35 -40,35 
         C -55,35 -65,26 -65,26 
         L -72,42 
         C -64,48 -55,61 -45,62 Z"
      fill="#00E5FF"
      opacity="0.4"
    />

    <!-- Prominent Arrow Head pointing to top-right (35 degrees) -->
    <path
      d="M 54,-42 
         L 96,-74 
         L 88,-22 
         L 72,-34 
         L 34,22 
         L 12,6 
         L 50,-50 
         L 38,-60 
         Z"
      fill="#00F0FF"
    />
    <polygon points="56,-42 98,-74 88,-22 75,-32 40,24 22,10 56,-42" fill="url(#coyectCyanBlue)" />
  </g>

  <!-- Typography: C Ø Y E C T -->
  <g id="coyect-wordmark" transform="translate(250, 335)">
    <!-- Letter C -->
    <text x="-162" y="0" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">C</text>

    <!-- Stylized Letter Ø (Electric Cyan Split Lens) -->
    <g transform="translate(-95, -18)">
      <!-- Outer Circle -->
      <circle cx="0" cy="0" r="23" fill="none" stroke="#00E5FF" stroke-width="7.5" />
      <!-- High-tech diagonal break / slash -->
      <path d="M -16,16 C -8,12 8,-12 16,-16" stroke="#040913" stroke-width="5" stroke-linecap="round" />
      <path d="M -18,18 C -10,8 10,-8 18,-18" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Letter Y -->
    <text x="-26" y="0" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Y</text>

    <!-- Letter E -->
    <text x="36" y="0" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">E</text>

    <!-- Letter C -->
    <text x="98" y="0" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">C</text>

    <!-- Letter T -->
    <text x="156" y="0" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">T</text>
  </g>

  <!-- Tagline: ENGINEERING INTELLIGENT MARKET GROWTH -->
  <g id="coyect-tagline" transform="translate(250, 390)">
    <text text-anchor="middle" font-family="'JetBrains Mono', 'Inter', monospace" font-size="11.5" font-weight="600" letter-spacing="4.5">
      <tspan fill="#A0AEC0">ENGINEERING </tspan>
      <tspan fill="#00E5FF" font-weight="800">INTELLIGENT </tspan>
      <tspan fill="#A0AEC0">MARKET GROWTH</tspan>
    </text>
  </g>
</svg>
